services:
  # Hostname your tunnel reaches n8n on: set N8N_WEBHOOK_URL to that host (see INSTALL.md).
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.44.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      GENERIC_TIMEZONE: Australia/Melbourne
      TZ: Australia/Melbourne
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_PROXY_HOPS: "1"
    volumes:
      - n8n_data:/home/node/.n8n
volumes:
  n8n_data:
